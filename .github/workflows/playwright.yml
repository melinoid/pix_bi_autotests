name: PIX BI Smoke Tests
on:
  push:
    branches: [bi_1.32]
  pull_request:
    branches: [bi_1.32]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BI_URL: ${{ secrets.BI_URL }}
      BI_USERNAME: ${{ secrets.BI_USERNAME }}
      BI_PASSWORD: ${{ secrets.BI_PASSWORD }}
      AD_USERNAME: ${{ secrets.AD_USERNAME }}
      AD_PASSWORD: ${{ secrets.AD_PASSWORD }}
      AD_HOST: ${{ secrets.AD_HOST }}
      AD_PORT: ${{ secrets.AD_PORT }}
      AD_DOMEN: ${{ secrets.AD_DOMEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts
          distribution: bullseye-slim
      - name: Install Dependencies
        run: npm ci --ignore-scripts && . .tools/remove_reporter_dirs
      - name: Install Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Smoke Tests
        run: npx playwright test -g "Smoke"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 3
